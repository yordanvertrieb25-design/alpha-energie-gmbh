<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Energie - Admin Login</title>

    <!-- Favicon for Google Search & Browsers (Glühbirne) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <img src="../logo.png" alt="Alpha Energie" class="login-logo">
            <h2>Admin Portal</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" required>
                </div>
                <div id="login-error" class="error-msg" style="display: none;">Ungültiges Passwort.</div>
                <button type="submit" class="btn btn-primary w-100">Einloggen</button>
            </form>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
